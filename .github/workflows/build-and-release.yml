name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build C/C++ Binaries (${{ matrix.arch_name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            arch_name: x64
          - arch: Win32
            arch_name: x86

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -B build -S .
          -A ${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build All Targets
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package with CPack
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - name: Rename Zip Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          $zip = Get-ChildItem -Path dist -Filter "*.zip" | Select-Object -First 1
          if ($zip) {
            Copy-Item $zip.FullName -Destination "output/oceanofgames-decoder-${{ matrix.arch_name }}.zip"
          }
          # Also package individual standalone executables
          Copy-Item "build/bin/Release/decoder.dll" -Destination "output/decoder-${{ matrix.arch_name }}.dll"
          Copy-Item "build/bin/Release/standalone_extractor.exe" -Destination "output/standalone_extractor-${{ matrix.arch_name }}.exe"
          Copy-Item "build/bin/Release/gof_extractor.exe" -Destination "output/gof_extractor-${{ matrix.arch_name }}.exe"
          Copy-Item "build/bin/Release/test_decoder.exe" -Destination "output/test_decoder-${{ matrix.arch_name }}.exe"

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.arch_name }}
          path: output/*

  build-python:
    name: Build Python Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Wheel & Source Distribution
        run: python -m build

      - name: Test Wheel Installation
        run: |
          pip install dist/*.whl
          safe-extractor --help

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [ build-native, build-python ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten Release Assets
        run: |
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
